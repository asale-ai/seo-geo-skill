[package]
name = "seogeo"
version = "0.1.3"
edition = "2021"
rust-version = "1.82"
description = "Single-binary execution engine for the SEO + GEO agent skills"
license = "MIT"
repository = "https://github.com/asale-ai/seo-geo-skill"
readme = "README.md"
keywords = ["seo", "geo", "ai-search", "cli", "agent-skills"]
categories = ["command-line-utilities"]

[[bin]]
name = "seogeo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip", "json", "charset", "socks-proxy"] }
url = "2.5"
regex = "1.11"
scraper = { version = "0.21", default-features = false }
quick-xml = "0.37"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
base64 = "0.22"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
dirs = "5"
rsa = { version = "0.9", features = ["sha2"] }
percent-encoding = "2.3"
encoding_rs = "0.8"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
include_dir = "0.7"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
