<svg xmlns="http://www.w3.org/2000/svg" width="880" height="309" viewBox="0 0 880 309" lang="en" role="img" aria-label="Measuring, not just advising — table">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d56f4"/>
      <stop offset="0.55" stop-color="#ff5fd1"/>
      <stop offset="1" stop-color="#43e5d0"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "Noto Sans Mono CJK SC", "Noto Sans Mono CJK JP", "Microsoft YaHei", "Hiragino Sans", "Yu Gothic", monospace; }
  </style>
  <rect x="0" y="0" width="880" height="309" rx="18.0" fill="#1a1a24"/>
  <rect x="0.5" y="0.5" width="879" height="308" rx="17.5" fill="none" stroke="#35334a"/>
  <text class="t" x="28" y="38" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">MEASURING, NOT JUST ADVISING</text>
  <text class="t" x="28" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">SET THIS</text>
  <text class="t" x="198" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">PROVIDER</text>
  <text class="t" x="351" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">ANSWERS FROM</text>
  <rect x="28" y="78" width="824" height="1" fill="#35334a"/>
  <rect x="28" y="89" width="142" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="34" y="102" font-size="12" fill="#edebfa" text-anchor="start">PERPLEXITY_API_KEY</text>
  <text class="t" x="198" y="102" font-size="13" fill="#edebfa" text-anchor="start">Perplexity Sonar</text>
  <text class="t" x="351" y="102" font-size="13" fill="#edebfa" text-anchor="start">live retrieval, with sources — the only one that can prove a</text>
  <text class="t" x="351" y="120" font-size="13" fill="#edebfa" text-anchor="start">page was cited</text>
  <rect x="20" y="131" width="840" height="35" rx="5.0" fill="#222130"/>
  <rect x="28" y="142" width="113" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="34" y="155" font-size="12" fill="#edebfa" text-anchor="start">OPENAI_API_KEY</text>
  <text class="t" x="198" y="155" font-size="13" fill="#edebfa" text-anchor="start">OpenAI</text>
  <text class="t" x="351" y="155" font-size="13" fill="#edebfa" text-anchor="start">model weights — whether the brand is known</text>
  <rect x="28" y="177" width="134" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="34" y="190" font-size="12" fill="#edebfa" text-anchor="start">ANTHROPIC_API_KEY</text>
  <text class="t" x="198" y="190" font-size="13" fill="#edebfa" text-anchor="start">Anthropic</text>
  <text class="t" x="351" y="190" font-size="13" fill="#edebfa" text-anchor="start">model weights</text>
  <rect x="20" y="201" width="840" height="35" rx="5.0" fill="#222130"/>
  <rect x="28" y="212" width="113" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="34" y="225" font-size="12" fill="#edebfa" text-anchor="start">GEMINI_API_KEY</text>
  <text class="t" x="198" y="225" font-size="13" fill="#edebfa" text-anchor="start">Google Gemini</text>
  <text class="t" x="351" y="225" font-size="13" fill="#edebfa" text-anchor="start">model weights</text>
  <text class="t" x="28" y="260" font-size="13" fill="#edebfa" text-anchor="start">(nothing)</text>
  <text class="t" x="198" y="260" font-size="13" fill="#edebfa" text-anchor="start">Ollama, locally</text>
  <text class="t" x="351" y="260" font-size="13" fill="#edebfa" text-anchor="start">model weights — free, for smoke-testing a prompt set</text>
  <rect x="28" y="271" width="824" height="1" fill="#35334a"/>
